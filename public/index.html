<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0d12">
<title>Προσωπικός Δικηγόρος · Personal Lawyer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c9a96e' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 3v18M5 7h14M5 7l-3 7a4 4 0 0 0 6 0L5 7zM19 7l-3 7a4 4 0 0 0 6 0l-3-7zM8 21h8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif:ital,wght@0,500;0,600;1,500&display=swap&subset=greek" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>

<header class="topbar">
  <button class="brand" id="brand" type="button">
    <svg viewBox="0 0 24 24" class="brand-ic" aria-hidden="true"><path d="M12 3v18M5 7h14M5 7l-3 7a4 4 0 0 0 6 0L5 7zM19 7l-3 7a4 4 0 0 0 6 0l-3-7zM8 21h8"/></svg>
    <span class="brand-text"><b id="appName"></b><small id="tagline"></small></span>
  </button>
  <div class="top-actions">
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="el" class="lang-btn">EL</button>
      <button type="button" data-lang="en" class="lang-btn">EN</button>
    </div>
    <button type="button" class="btn ghost" id="historyBtn"></button>
    <button type="button" class="btn gold" id="newBtn"></button>
  </div>
</header>

<div class="demo-banner" id="demoBanner" hidden></div>

<main id="app">
  <!-- Landing -->
  <section id="home" class="view">
    <div class="hero">
      <h1 id="heroTitle"></h1>
      <p id="heroSub"></p>
    </div>
    <h2 class="section-label" id="chooseArea"></h2>
    <div class="cards" id="cards"></div>
    <p class="fineprint" id="privacy"></p>
  </section>

  <!-- Intake + Chat share the conversation layout -->
  <section id="convo" class="view" hidden>
    <div class="convo-head">
      <div class="progress" id="progress" hidden><span id="progressBar"></span></div>
      <div class="context" id="context"></div>
    </div>
    <div class="messages" id="messages" aria-live="polite"></div>
    <div class="dock" id="dock">
      <div class="chips" id="chips"></div>
      <form class="composer" id="composer" autocomplete="off">
        <textarea id="input" rows="1" enterkeyhint="send"></textarea>
        <button type="button" class="btn ghost small" id="skipBtn" hidden></button>
        <button type="submit" class="send" id="sendBtn" aria-label="Send">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>
      <div class="foot" id="footNote"></div>
    </div>
  </section>
</main>

<aside class="drawer" id="drawer" hidden>
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <div class="drawer-panel" role="dialog" aria-modal="true">
    <div class="drawer-head"><h3 id="historyTitle"></h3><button type="button" class="btn ghost small" id="drawerClose"></button></div>
    <div class="drawer-list" id="historyList"></div>
    <div class="drawer-foot"><button type="button" class="btn ghost small danger" id="clearAll"></button></div>
  </div>
</aside>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
