services:
  - type: web
    name: greek-lawyer
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: LLM_API_KEY
        sync: false          # set in the Render dashboard; empty => demo mode
      - key: LLM_BASE_URL
        value: https://api.x.ai/v1
      - key: LLM_MODEL
        value: grok-4
      - key: NODE_VERSION
        value: "20"
